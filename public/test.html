        async function test() {

                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            } else {
                document.getElementById('result').innerHTML = `
                    <h2>Courses Found: ${courses.length}</h2>
                    <ul>
                        ${courses.map(c => `<li>${c.name} - KES ${c.price}</li>`).join('')}
                    </ul>
                `;
            }
        }
        
        test();
    </script>
